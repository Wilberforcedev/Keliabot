name: Paper trading tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r Keliabot/requirements.txt
      - name: Run offline tests
        working-directory: Keliabot
        run: python -m unittest test_paper_trading test_backtesting test_market_data test_compare_timeframes test_strategy_orders -v
